name: Deploy web test3
on:
  push:
    branches:
    - test3

permissions:
  contents: read

jobs:
  deploy_job:
    name: Deploy Job
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main branch with submodules
      uses: actions/checkout@v7
      with:
        ref: 'test3'
        submodules: 'true'
        fetch-depth: '0'
    # - name: Change the version of Service Worker
    #   run: |
    #     sed -i "s/const\sversion\s=\s.*;/const version = '$GITHUB_RUN_ID';/g" static/sw.js
    #     head static/sw.js

    - name: Setup Node.js (LTS)
      uses: actions/setup-node@v7
      with:
        node-version: '24' # Node.js 24 LTS
        cache: 'npm'

    - name: Install NPM Dependencies (Workbox)
      run: npm ci

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.167.0'
        extended: true

    - name: Build the page with Hugo
      run: hugo --enableGitInfo --minify --buildDrafts --baseURL https://test3.zwieratko.sk/

    - name: Generate Service Worker
      run: npm run generate-sw

    - name: Record the build variables
      run: |
        {
          echo "<p>"
          date
          echo -e "</p>\n<p>"
          hugo version
          echo -e "</p>\n<p>"
          echo ":)"
          echo -e "</p>\n<p>"
          echo "$GITHUB_SHA"
          echo -e "</p>\n<p>"
          echo "$GITHUB_RUN_ID"
          echo -e "</p>\n<p>"
          echo "$GITHUB_RUN_NUMBER"
          echo "</p> :)"
        } > public/stav.html 2>&1
    # - name: Check and fix the version of bundle assets
    #   run: |
    #     sed -i "s='/css/style.*,='/css/$(basename public/css/style*)',=g" public/sw.js
    #     sed -i "s='/js/bundle.*,='/js/$(basename public/js/bundle*)',=g" public/sw.js

    - name: Check internal links with Lychee
      uses: lycheeverse/lychee-action@v2
      with:
        args: >-
          --offline
          --no-progress
          --root-dir public
          --index-files index.html
          --remap "https://test3.zwieratko.sk file://${{ github.workspace }}/public"
          --exclude "https://test3.zwieratko.sk/posts"
          public
        fail: true

    - name: Do brotli compression
      run: |
        brotli -V
        find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec brotli -f -k {} +

    - name: Start SSH Agent
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.DEPLOY_KEY }}

    - name: SSH host keys setup
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        # KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
      run: |
        mkdir -p ~/.ssh
        # echo "${KNOWN_HOSTS}" >> ~/.ssh/known_hosts
        ssh-keyscan -t ed25519 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        chmod 700 ~/.ssh

    - name: Deploy the page with Rsync
      env:
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        LOCAL_PATH: 'public/'
        REMOTE_PATH: '~/zwieratko.sk/sub/test3/'
      run: |
        rsync -azhv --stats --delete -e "ssh -T -x -p ${DEPLOY_PORT}" "${LOCAL_PATH}" "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}"
